name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[scverse,dev]"
      - name: Run unit & determinism test suite (offline simulator backend)
        run: .venv/bin/pytest -v
      - name: Smoke test CLI plumbing (SYNTHETIC data + scripted simulator; never a result)
        run: |
          .venv/bin/crispr-reflexion ablate-sketch --scenario pd1-exhaustion --simulator --sketch-size 16 --pool-size 96
          .venv/bin/crispr-reflexion optimize --scenario pd1-exhaustion --simulator --sketch-size 16 --pool-size 96 --max-iterations 4
      - name: Reference-condition table is shipped and queryable (offline, no API key)
        run: .venv/bin/crispr-reflexion conditions "CD8-positive" --modality methylation --limit 5
