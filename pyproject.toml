[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gene-edit-check"
version = "0.3.1"
description = "Computational-biology toolkit that checks whether a CRISPR base edit works only in the cells you want, using AlphaGenome 2 as the judge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["computational-biology", "bioinformatics", "alphagenome", "crispr", "base-editing", "single-cell", "regulatory-genomics", "gene-editing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
authors = [
    { name = "Arav Mendiratta" }
]
dependencies = [
    "alphagenome>=0.1.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/aravmendiratta/gene-edit-check"
Issues = "https://github.com/aravmendiratta/gene-edit-check/issues"
Changelog = "https://github.com/aravmendiratta/gene-edit-check/blob/main/CHANGELOG.md"

[project.optional-dependencies]
scverse = [
    "anndata>=0.10.0",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
gene-edit-check = "gene_edit_check.cli:app"
gene-edit-check-mcp = "gene_edit_check.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gene_edit_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
