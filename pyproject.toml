[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crispr-reflexion"
version = "0.3.0"
description = "Two-tier single-cell & sequence-hazard verifier and gradient-guided CRISPR base-editing optimizer powered by Google DeepMind AlphaGenome 2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["alphagenome", "crispr", "base-editing", "single-cell", "regulatory-genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
authors = [
    { name = "Arav Mendiratta" }
]
dependencies = [
    "alphagenome>=0.1.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
scverse = [
    "anndata>=0.10.0",
]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
crispr-reflexion = "crispr_reflexion.cli:app"
crispr-reflexion-mcp = "crispr_reflexion.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crispr_reflexion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
